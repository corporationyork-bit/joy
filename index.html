<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0F2A43">
<title>JOY CORPORATION</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;box-shadow:none!important;text-shadow:none!important}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#060E1A;color:#e2e8f0}
#login{position:fixed;inset:0;z-index:999;background:#060E1A;display:grid;place-items:center;padding:20px}
.lbox{width:min(90vw,330px);text-align:center;background:#0b1526;border:1px solid #1B2E4B;border-radius:18px;padding:24px}
.limg{width:88px;height:88px;object-fit:contain;background:#fff;border-radius:16px;margin:0 auto;display:block}
.lname{font-weight:800;color:#fff;margin-top:10px;letter-spacing:.5px}
.ltag{color:#94a3b8;font-size:12px;font-style:italic;margin-top:3px}
.linp{width:100%;margin-top:18px;background:#10203A;border:1px solid #1B2E4B;color:#e2e8f0;border-radius:12px;padding:12px;text-align:center;font-size:16px;letter-spacing:6px;outline:none}
.linp:focus{border-color:#2E9E6B}
.lbtn{width:100%;margin-top:10px;background:#0F2A43;color:#fff;font-weight:800;border:1px solid #2E9E6B;border-radius:12px;padding:13px;font-size:14px;cursor:pointer}
.lforgot{display:block;margin-top:12px;background:none;border:0;color:#94a3b8;font-size:12px;cursor:pointer;margin-inline:auto}
.card{background:#0b1526;border:1px solid #1B2E4B;border-radius:16px;padding:16px;margin:12px}
.btn{background:#10203A;color:#e2e8f0;border:1px solid #1B2E4B;border-radius:10px;padding:8px 11px;font-size:12px;margin:2px;cursor:pointer;outline:none}
.btn.active{border-color:#2E9E6B;color:#fff}
.btn.danger{background:#2a1215;border-color:#5c2329;color:#fca5a5}
.p{background:#0F2A43;color:#fff;font-weight:700;border-color:#2E9E6B}
.g{background:#143326;color:#6ee7b7;font-weight:700;border-color:#2E9E6B}
input,select,textarea{width:100%;background:#10203A;color:#e2e8f0;border:1px solid #1B2E4B;border-radius:10px;padding:10px;margin:5px 0;font-size:14px;outline:none}
input:focus,select:focus,textarea:focus{border-color:#2E9E6B}
nav{display:flex;overflow-x:auto;gap:6px;padding:8px;background:#070f1c;position:sticky;top:0;z-index:10;border-bottom:1px solid #1B2E4B}
nav button{white-space:nowrap}
h2{margin:0 0 8px;color:#fff}
h3{margin:14px 0 6px;color:#e2e8f0;font-size:15px}
.m{color:#94a3b8;font-size:13px;line-height:1.45}
.hide{display:none}
.dimg{width:44px;height:44px;object-fit:contain;background:#fff;border-radius:10px;display:inline-block}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.snap-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #132238;flex-wrap:wrap}
.snap-item:last-child{border-bottom:0}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;background:#10203A;border:1px solid #1B2E4B;color:#cbd5e1}
.resbox{background:#060E1A;border:1px solid #1B2E4B;border-radius:12px;padding:10px;margin-top:8px;font-size:12px;color:#cbd5e1;line-height:1.45}
#modal{position:fixed;inset:0;z-index:1000;background:rgba(4,9,17,.85);display:none;place-items:center;padding:16px;overflow-y:auto}
.mbox{width:min(94vw,700px);max-height:86vh;overflow-y:auto;background:#0b1526;border:1px solid #1B2E4B;border-radius:18px;padding:18px}
pre.gumcopy{background:#060E1A;border:1px solid #1B2E4B;border-radius:12px;padding:12px;white-space:pre-wrap;word-break:break-word;font-size:12px;color:#cbd5e1;line-height:1.5;margin:8px 0}
.art-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:10px}
.art-box{background:#060E1A;border:1px solid #1B2E4B;border-radius:12px;padding:8px}
.art-box img{width:100%;height:auto;border-radius:8px;display:block;border:1px solid #1B2E4B}
</style>
</head>
<body>
<div id="login">
  <div class="lbox">
    <img id="loginLogo" class="limg" alt="JOY CORPORATION">
    <div class="lname">JOY CORPORATION</div>
    <div class="ltag">Kami ada karena kamu Ade</div>
    <input id="pin" class="linp" type="password" inputmode="numeric" maxlength="8" placeholder="Masukan PIN" autocomplete="off">
    <button id="loginBtn" class="lbtn" type="button" onclick="login()">LOGIN</button>
    <button id="forgotBtn" class="lforgot" type="button" onclick="forgot()">Lupa PIN</button>
    <div id="err" class="m hide" style="color:#fca5a5;margin-top:8px">PIN salah.</div>
    <div id="fnote" class="m hide" style="color:#fde68a;margin-top:8px">PIN telah direset ke PIN dasar. Segera ganti di Pengaturan.</div>
    <div id="dbg" class="m" style="margin-top:8px;font-size:11px;word-break:break-word">Siap.</div>
  </div>
</div>

<div id="app" class="hide">
  <nav id="nav"></nav>
  <div id="bn" class="card hide" style="background:#2b230c;border-color:#5c4a16"></div>
  <div id="v"></div>
</div>

<div id="modal" onclick="if(event.target===this)closeModal()">
  <div class="mbox">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
      <h2 id="mTitle" style="margin:0">Detail Produk</h2>
      <button class="btn" type="button" onclick="closeModal()">Tutup</button>
    </div>
    <div id="mBody" style="margin-top:10px"></div>
  </div>
</div>

function makeMarketPrice(basePrice, cut){
  const raw = Math.max(9.99, Math.min(1000, Number(basePrice) - Number(cut)));
  return Number.isInteger(raw) ? raw : Number(raw.toFixed(2));
}

function H(s){
  const str = String(s ?? "");
  let h1 = 5381;
  let h2 = 2166136261;
  for(let i = 0; i < str.length; i++){
    const code = str.charCodeAt(i);
    h1 = (((h1 << 5) + h1) + code) >>> 0;
    h2 ^= code;
    h2 = Math.imul(h2, 16777619) >>> 0;
  }
  return h1.toString(16).padStart(8, "0") + h2.toString(16).padStart(8, "0");
}

function idb(){
  return new Promise((a,b) => {
    try{
      if(!window.indexedDB) return b(new Error("no idb"));
      const r = indexedDB.open("joy_db", 1);
      r.onupgradeneeded = () => { if(!r.result.objectStoreNames.contains("kv")) r.result.createObjectStore("kv"); };
      r.onsuccess = () => a(r.result);
      r.onerror = () => b(r.error);
    }catch(err){ b(err); }
  });
}
async function G(k){
  try{
    const d = await idb();
    return await new Promise(a => {
      const q = d.transaction("kv").objectStore("kv").get(k);
      q.onsuccess = () => a(q.result ?? MEM["idb_" + k] ?? null);
      q.onerror = () => a(MEM["idb_" + k] ?? null);
    });
  }catch{ return MEM["idb_" + k] ?? null; }
}
async function Z(k,v){
  MEM["idb_" + k] = v;
  try{
    const d = await idb();
    return await new Promise(a => {
      const t = d.transaction("kv","readwrite");
      t.objectStore("kv").put(v,k);
      t.oncomplete = () => a(1);
      t.onerror = () => a(0);
    });
  }catch{ return 0; }
}

function pdfAscii(str){
  return String(str ?? "")
    .replace(/[—–]/g, "-")
    .replace(/[“”]/g, '"')
    .replace(/[’‘]/g, "'")
    .replace(/•/g, "*")
    .replace(/…/g, "...")
    .replace(/[^\x20-\x7E]/g, " ");
}

function escPdfText(str){
  return pdfAscii(str)
    .replace(/\\/g, "\\\\")
    .replace(/\(/g, "\\(")
    .replace(/\)/g, "\\)");
}

function wrapPdfLines(text, maxChars){
  const limit = maxChars || 78;
  const result = [];
  const paragraphs = String(text ?? "").split("\n");
  for(const para of paragraphs){
    if(para.trim() === ""){
      result.push("");
      continue;
    }
    const words = para.trim().split(/\s+/);
    let line = "";
    for(const w of words){
      const candidate = line ? line + " " + w : w;
      if(candidate.length <= limit){
        line = candidate;
      }else{
        if(line) result.push(line);
        if(w.length > limit){
          for(let i = 0; i < w.length; i += limit){
            result.push(w.slice(i, i + limit));
          }
          line = "";
        }else{
          line = w;
        }
      }
    }
    if(line) result.push(line);
  }
  return result;
}

  ];

  const wrapped = wrapPdfLines(lines.join("\n"), 78);
  const perPage = 44;
  const pages = [];
  for(let i = 0; i < wrapped.length; i += perPage){
    pages.push(wrapped.slice(i, i + perPage));
  }
  while(pages.length < 40){
    const idx = pages.length - 1;
    const baseSlice = wrapped.slice((idx % Math.max(1, Math.floor(wrapped.length / perPage))) * perPage);
    pages.push(baseSlice.length ? baseSlice.slice(0, perPage) : ["JOY CORPORATION - Appendix & Reference Notes"]);

function createPdfBlobFromPages(pages, prod){
  const pageW = 612;
  const pageH = 792;
  const objects = [];
  const totalPages = pages.length;

  const catalogObjNum = 1;
  const pagesObjNum = 2;
  const fontRegObjNum = 3;
  const fontBoldObjNum = 4;
  const firstPageObjNum = 5;

  const pageObjNums = [];
  const contentObjNums = [];
  for(let i = 0; i < totalPages; i++){
    pageObjNums.push(firstPageObjNum + i * 2);
    contentObjNums.push(firstPageObjNum + i * 2 + 1);
  }

  objects[catalogObjNum] = `<< /Type /Catalog /Pages ${pagesObjNum} 0 R >>`;
  objects[pagesObjNum] = `<< /Type /Pages /Kids [${pageObjNums.map(n => `${n} 0 R`).join(" ")}] /Count ${totalPages} >>`;
  objects[fontRegObjNum] = `<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>`;
  objects[fontBoldObjNum] = `<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>`;

  for(let p = 0; p < totalPages; iOrP = p, p++){
    const pageLines = pages[p];
    const streamParts = [
      "0.059 0.165 0.263 rg",
      `0 ${pageH - 42} ${pageW} 42 re f`,
      "0.180 0.620 0.420 rg",
      `0 ${pageH - 46} ${pageW} 4 re f`,
      "1 1 1 rg",
      "BT /F2 11 Tf 42 764 Td (" + escPdfText("JOY CORPORATION  |  " + (prod.title || "Pricing Strategy Toolkit")) + ") Tj ET",
      "0.059 0.165 0.263 rg",
      "BT /F2 10 Tf 42 718 Td (" + escPdfText(`Section Page ${p + 1} of ${totalPages}`) + ") Tj ET",
      "0.118 0.149 0.188 rg"
    ];

    let y = 696;
    for(const rawLine of pageLines){
      if(y < 52) break;
      const isHeading = /^(JOY CORPORATION|WELCOME PAGE|WHAT'S INSIDE|4-WEEK ACTION PLAN|TABLE OF CONTENTS|10 STEP-BY-STEP MODULES|6 FILLABLE WORKSHEETS|REAL-WORLD CASE STUDIES|PRICING CALCULATOR INSTRUCTIONS|COST-TO-SERVE CALCULATION|MINIMUM VIABLE PRICE FORMULA|PRICING LADDER|BUNDLE BUILDER|DISCOUNT APPROVAL MATRIX|PAID PILOT FRAMEWORK|PILOT ROI TRACKER|PRICING KPI DASHBOARD|LAUNCH CHECKLIST|CUSTOMER INTERVIEW QUESTIONS|ONE-PAGE PRICING PROPOSAL TEMPLATE|EMAIL LAUNCH TEMPLATES|OBJECTION HANDLING GUIDE|FAQ|PRICING DECISION TEMPLATE|CLOSING PAGE|Module \d+|Worksheet \d+)/.test(rawLine.trim());
      if(rawLine.trim() !== ""){
        const fontTag = isHeading ? "/F2 10 Tf" : "/F1 9.5 Tf";
        streamParts.push(`BT ${fontTag} 42 ${y} Td (` + escPdfText(rawLine) + ") Tj ET");
      }
      y -= 14;
    }

    streamParts.push(
      "0.392 0.455 0.545 rg",
      "BT /F1 9 Tf 42 26 Td (" + escPdfText("JOY CORPORATION  -  Page " + (p + 1) + " / " + totalPages) + ") Tj ET"
    );

    const streamStr = streamParts.join("\n");
    objects[pageObjNums[p]] = `<< /Type /Page /Parent ${pagesObjNum} 0 R /MediaBox [0 0 ${pageW} ${pageH}] /Resources << /Font << /F1 ${fontRegObjNum} 0 R /F2 ${fontBoldObjNum} 0 R >> >> /Contents ${contentObjNums[p]} 0 R >>`;
    objects[contentObjNums[p]] = `<< /Length ${streamStr.length} >>\nstream\n${streamStr}\nendstream`;
  }

  let pdf = "%PDF-1.4\n";
  const offsets = [0];
  for(let i = 1; i < objects.length; i++){
    offsets[i] = pdf.length;
    pdf += `${i} 0 obj\n${objects[i]}\nendobj\n`;
  }
  const xrefPos = pdf.length;
  pdf += `xref\n0 ${objects.length}\n`;
  pdf += "0000000000 65535 f \n";
  for(let i = 1; i < objects.length; i++){
    pdf += String(offsets[i]).padStart(10, "0") + " 00000 n \n";
  }
  pdf += `trailer\n<< /Size ${objects.length} /Root ${catalogObjNum} 0 R >>\nstartxref\n${xrefPos}\n%%EOF`;

  return new Blob([pdf], { type: "application/pdf" });
}

function dlPdf(id){
  const x = findProd(id);
  if(!x) return;
  const pages = buildFullEnglishToolkitLines(x);
  const blob = createPdfBlobFromPages(pages, x);
  const fname = pdfFileName(x);
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = fname;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  setRaw("joy_ld", new Date().toISOString());
  log("download_pdf", fname + ` (${pages.length} pp.)`);
}

              <span class="pill">Mode: ${E(x.mode || "permintaan")}</span>
              ${x.demandScore ? `<span class="pill">Minat Pasar: ${E(x.demandScore)}/100</span>` : ""}
              <span class="m">Audiens: ${E(x.aud || "-")}</span>
            </div>
            ${x.marketNote ? `<div class="m" style="margin-top:4px">Pasar: ${E(x.marketNote)}</div>` : ""}
            <div class="m" style="margin-top:4px">SOP: ${E(x.sop || "SOP-STD: 1 PDF lengkap 40+ halaman + Cover/Thumbnail PNG + teks Gumroad A-F.")}</div>
            ${prodActionsHtml(x.id, "prod", `
              <button class="btn" type="button" onclick="setp('${E(x.id)}',item=>{item.status='qc';item.qc=item.qc||88});log('qc','${E(x.id)}');go('prod')">Ke QC</button>
              <button class="btn" type="button" onclick="setp('${E(x.id)}',item=>item.status='archived');log('arsip','${E(x.id)}');go('prod')">Arsipkan</button>
            `)}
          </div>`).join("");
    }

    if(v === "qc"){
      const items = p.filter(x => x.status === "qc");
      h = '<div class="card"><h2>Kontrol Kualitas</h2></div>' +
        (items.map(x => `
          <div class="card">
            <b>${E(x.title)}</b>
            <div class="m">Skor ${E(x.qc ?? 0)}/100 • Harga: ${E(formatPriceLabel(x.price))} • Mode: ${E(x.mode || "permintaan")}</div>
            <div class="m">SOP: ${E(x.sop || "SOP-STD: 1 PDF lengkap 40+ halaman + Cover/Thumbnail PNG + teks Gumroad A-F.")}</div>
            ${prodActionsHtml(x.id, "qc", `
              <button class="btn p" type="button" onclick="setp('${E(x.id)}',item=>item.status='pending');log('pending','${E(x.id)}');go('qc')">Lolos ke Pending</button>
              <button class="btn" type="button" onclick="setp('${E(x.id)}',item=>item.status='draft');log('revisi','${E(x.id)}');go('qc')">Revisi</button>
            `)}
          </div>`).join("") || '<div class="card m">Tidak ada produk di QC.</div>');
    }

    if(v === "vault"){
      const items = p.filter(x => ["pending","public","archived"].includes(x.status));
      h = '<div class="card"><h2>Asset Vault</h2><div class="m">Kelola produk Pending, Public, dan Arsip.</div></div>' +
        (items.map(x => `
          <div class="card">
            <b>${E(x.title)}</b> <span class="m">[${E(x.status)}] ${E(formatPriceLabel(x.price))}</span>
            <div class="m">SOP: ${E(x.sop || "SOP-STD: 1 PDF lengkap 40+ halaman + Cover/Thumbnail PNG + teks Gumroad A-F.")}</div>
            ${prodActionsHtml(x.id, "vault", x.status === "pending"
              ? `<button class="btn p" type="button" onclick="pub('${E(x.id)}')">Setujui Public</button>`
              : "")}
          </div>`).join("") || '<div class="card m">Belum ada asset.</div>');
    }

    if(v === "gum"){
      const g = L("joy_gumroad", {});
      h = `
        <div class="card">
          <h2>Gumroad</h2>
          <div class="m">Upload langsung ke API Gumroad memerlukan endpoint backend/token server. Simpan Store URL &amp; prefix di bawah untuk menyiapkan paket upload produk.</div>
          <input id="gs" placeholder="Store URL" value="${E(g.store || "")}">
          <input id="gp" placeholder="Seller prefix" value="${E(g.prefix || "")}">
          <button class="btn p" type="button" onclick="saveGum()">Simpan</button>
        </div>`;
    }

    if(v === "fin"){
      h = '<div class="card"><h2>Keuangan</h2><p class="m">Belum ada penjualan nyata. Pendapatan dibaca dari Gumroad setelah backend aktif. Tidak ada angka palsu.</p></div>';
    }

    if(v === "settings"){
      const fh = await G("fh");
      const sn = (await G("snaps")) || [];
      let pm = "";
      if(fh && fh.queryPermission) try{ pm = await fh.queryPermission({ mode: "readwrite" }); }catch{}
      const fileStatus = pm === "granted" ? "AKTIF" : fh ? "butuh izin (tekan LOGIN)" : "belum diaktifkan";
      h = `
        <div class="card">
          <h2>Cadangan Otomatis</h2>
          <p class="m">
            Internal: AKTIF (tiap perubahan &amp; 1 jam). Terakhir: ${E(F(getRaw("joy_ls")))}<br>
            File di telepon: ${fileStatus}. Terakhir: ${E(F(getRaw("joy_lf")))}<br>
            Unduhan terakhir: ${E(F(getRaw("joy_ld")))}
          </p>
          <div class="row">
            <button class="btn p" type="button" onclick="enable()">${fh ? "Pilih File Baru" : "Aktifkan Cadangan Otomatis ke File"}</button>
            <button class="btn" type="button" onclick="exp()">Simpan Cadangan Sekarang</button>
            <label class="btn" style="display:inline-block">
              Pulihkan dari File
              <input type="file" accept=".json,application/json" class="hide" onchange="imp(event)">
            </label>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap">
            <h3 style="margin:0">Riwayat internal (${sn.length})</h3>
            ${sn.length ? `<button class="btn danger" type="button" onclick="clearSnaps()">Hapus Semua</button>` : ""}
          </div>
          <div style="margin-top:6px">
            ${sn.map((s, i) => `
              <div class="snap-item">
                <span class="m">${E(F(s.at))}</span>
                <div>
                  <button class="btn" type="button" onclick="rest(${i})">Pulihkan</button>
                  <button class="btn danger" type="button" onclick="delSnap(${i})">Hapus</button>
                </div>
              </div>`).join("") || '<div class="m">Belum ada.</div>'}
          </div>
        </div>
        <div class="card">
          <h2>PIN</h2>
          <input id="np" type="password" inputmode="numeric" maxlength="8" placeholder="PIN baru (min 6 digit)">
          <button class="btn p" type="button" onclick="saveNewPin()">Simpan PIN</button>
        </div>`;
    }

    $("v").innerHTML = h;
    await ban();
  }catch(err){
    dbg("Go error: " + (err?.message || err));
  }
}

function saveGum(){
  S("joy_gumroad", {
    store: $("gs").value.trim(),
    prefix: $("gp").value.trim()
  });
  log("gumroad", "disimpan");
  alert("Tersimpan");
}

function mk(){
  const rawT = $("t").value.trim() || "Pricing Strategy";
  const t = rawT.replace(/\b\w/g, c => c.toUpperCase());
  const a = $("a").value.trim() || "SaaS founders, AI product builders, consultants, product managers, freelancers, B2B teams";
  const rawPr = $("pr").value.trim();
  const parsedPr = rawPr === "" ? null : parseFloat(rawPr);
  const price = (parsedPr !== null && !Number.isNaN(parsedPr) && parsedPr >= 0) ? parsedPr : null;
  const title = rawT.toLowerCase().includes("toolkit") ? t : "The Complete " + t + " Toolkit";
  const item = {
    id: "JOY-" + Date.now(),
    title,
    subtitle: "How to Price SaaS, AI & Enterprise Solutions with Confidence",
    price,
    status: "draft",
    qc: 0,
    aud: a,
    mode: "permintaan",
    sop: "SOP-REQ-01: 1 file PDF lengkap (40+ halaman, English) + Cover 1600x900 PNG + Thumbnail 600x600 PNG + teks Gumroad A-F."
  };
  SP([item, ...P()]);
  log("draft_permintaan_pdf", title + (price !== null ? ` ($${price})` : " (harga kosong)"));
  dlPdf(item.id);
  go("prod");
}

function mkAutoBatch(count){
  const n = Math.max(1, Math.min(count || 5, MARKET_RESEARCH_POOL.length));
  const p = P();
  const existingTitles = new Set(p.map(x => String(x.title || "").toLowerCase()));
  const picked = [];

  for(let step = 0; step < MARKET_RESEARCH_POOL.length && picked.length < n; step++){
    const idx = (marketCursor + step) % MARKET_RESEARCH_POOL.length;
    const item = MARKET_RESEARCH_POOL[idx];
    if(!existingTitles.has(item.title.toLowerCase())){
      picked.push(item);
      existingTitles.add(item.title.toLowerCase());
    }
  }

  if(picked.length < n){
    for(let step = 0; step < MARKET_RESEARCH_POOL.length && picked.length < n; step++){
      const idx = (marketCursor + step) % MARKET_RESEARCH_POOL.length;
      const item = MARKET_RESEARCH_POOL[idx];
      if(!picked.some(x => x.title === item.title)){
        picked.push({
          ...item,
          title: item.title + " (Ed. " + (Math.floor(Date.now() / 1000) % 100) + ")"
        });
      }
    }
  }

  marketCursor = (marketCursor + n) % MARKET_RESEARCH_POOL.length;
  const now = Date.now();
  const created = picked.map((item, i) => ({
    id: "JOY-AUTO-" + (now + i),
    title: item.title,
    subtitle: item.subtitle,
    price: item.price,
    marketPrice: item.marketPrice,
    demandScore: item.demandScore,
    marketNote: item.marketNote,
    status: "draft",
    qc: item.qc,
    aud: item.aud,
    mode: "otomatis",
    sop: item.sop
  }));

  SP([...created, ...p]);
  log("riset_harga_produksi_pdf_5", created.map(x => `${x.title} ($${x.price})`).join(", "));
  created.forEach((item, idx) => {
    setTimeout(() => dlPdf(item.id), idx * 300);
  });
  go("prod");
}

function pub(id){
  if(!L("joy_gumroad", {}).store) return alert("Simpan Store URL Gumroad dulu.");
  setp(id, x => x.status = "public");
  log("public", id);
  go("vault");
}

function saveNewPin(){
  const v = $("np").value.trim();
  if(v.length < 6) return alert("Minimal 6 digit.");
  setRaw("joy_pin", H(v));
  sched();
  alert("PIN diganti.");
}

if(location.protocol !== "file:" && location.protocol !== "content:" && location.protocol !== "about:" && "serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
try{ if(getRaw("joy_ses")) start(); }catch{}
