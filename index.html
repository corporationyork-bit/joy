<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0F2A43">
<title>JOY CORPORATION</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;box-shadow:none!important;text-shadow:none!important}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#060E1A;color:#e2e8f0}
#login{position:fixed;inset:0;z-index:999;background:#060E1A;display:grid;place-items:center;padding:20px}
.lbox{width:min(90vw,330px);text-align:center;background:#0b1526;border:1px solid #1B2E4B;border-radius:18px;padding:24px}
.limg{width:88px;height:88px;object-fit:contain;background:#fff;border-radius:16px;margin:0 auto;display:block}
.lname{font-weight:800;color:#fff;margin-top:10px;letter-spacing:.5px}
.ltag{color:#94a3b8;font-size:12px;font-style:italic;margin-top:3px}
.linp{width:100%;margin-top:18px;background:#10203A;border:1px solid #1B2E4B;color:#e2e8f0;border-radius:12px;padding:12px;text-align:center;font-size:16px;letter-spacing:6px;outline:none}
.linp:focus{border-color:#2E9E6B}
.lbtn{width:100%;margin-top:10px;background:#0F2A43;color:#fff;font-weight:800;border:1px solid #2E9E6B;border-radius:12px;padding:13px;font-size:14px;cursor:pointer}
.lforgot{display:block;margin-top:12px;background:none;border:0;color:#94a3b8;font-size:12px;cursor:pointer;margin-inline:auto}
.card{background:#0b1526;border:1px solid #1B2E4B;border-radius:16px;padding:16px;margin:12px}
.btn{background:#10203A;color:#e2e8f0;border:1px solid #1B2E4B;border-radius:10px;padding:8px 11px;font-size:12px;margin:2px;cursor:pointer;outline:none}
.btn.active{border-color:#2E9E6B;color:#fff}
.btn.danger{background:#2a1215;border-color:#5c2329;color:#fca5a5}
.p{background:#0F2A43;color:#fff;font-weight:700;border-color:#2E9E6B}
.g{background:#143326;color:#6ee7b7;font-weight:700;border-color:#2E9E6B}
input,select,textarea{width:100%;background:#10203A;color:#e2e8f0;border:1px solid #1B2E4B;border-radius:10px;padding:10px;margin:5px 0;font-size:14px;outline:none}
input:focus,select:focus,textarea:focus{border-color:#2E9E6B}
nav{display:flex;overflow-x:auto;gap:6px;padding:8px;background:#070f1c;position:sticky;top:0;z-index:10;border-bottom:1px solid #1B2E4B}
nav button{white-space:nowrap}
h2{margin:0 0 8px;color:#fff}
h3{margin:14px 0 6px;color:#e2e8f0;font-size:15px}
.m{color:#94a3b8;font-size:13px;line-height:1.45}
.hide{display:none}
.dimg{width:44px;height:44px;object-fit:contain;background:#fff;border-radius:10px;display:inline-block}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.snap-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #132238;flex-wrap:wrap}
.snap-item:last-child{border-bottom:0}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;background:#10203A;border:1px solid #1B2E4B;color:#cbd5e1}
.status-banner{background:#0f2438;border:1px solid #2E9E6B;color:#d1fae5;border-radius:12px;padding:10px 12px;margin-top:10px;font-size:12px;line-height:1.45}
.chat-box{background:#060E1A;border:1px solid #1B2E4B;border-radius:14px;padding:12px;max-height:360px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-top:10px}
.msg{max-width:88%;padding:10px 12px;border-radius:12px;font-size:13px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:#0F2A43;border:1px solid #2E9E6B;color:#fff}
.msg.bot{align-self:flex-start;background:#10203A;border:1px solid #1B2E4B;color:#e2e8f0}
#modal{position:fixed;inset:0;z-index:1000;background:rgba(4,9,17,.85);display:none;place-items:center;padding:16px;overflow-y:auto}
.mbox{width:min(94vw,700px);max-height:86vh;overflow-y:auto;background:#0b1526;border:1px solid #1B2E4B;border-radius:18px;padding:18px}
pre.gumcopy{background:#060E1A;border:1px solid #1B2E4B;border-radius:12px;padding:12px;white-space:pre-wrap;word-break:break-word;font-size:12px;color:#cbd5e1;line-height:1.5;margin:8px 0}
.art-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:10px}
.art-box{background:#060E1A;border:1px solid #1B2E4B;border-radius:12px;padding:8px}
.art-box img{width:100%;height:auto;border-radius:8px;display:block;border:1px solid #1B2E4B}
</style>
</head>
<body>
<div id="login">
  <div class="lbox">
    <img id="loginLogo" class="limg" alt="JOY CORPORATION">
    <div class="lname">JOY CORPORATION</div>
    <div class="ltag">Kami ada karena kamu Ade</div>
    <input id="pin" class="linp" type="password" inputmode="numeric" maxlength="8" placeholder="Masukan PIN" autocomplete="off">
    <button id="loginBtn" class="lbtn" type="button" onclick="login()">LOGIN</button>
    <button id="forgotBtn" class="lforgot" type="button" onclick="forgot()">Lupa PIN</button>
    <div id="err" class="m hide" style="color:#fca5a5;margin-top:8px">PIN salah.</div>
    <div id="fnote" class="m hide" style="color:#fde68a;margin-top:8px">PIN telah direset ke PIN dasar. Segera ganti di Pengaturan.</div>
    <div id="dbg" class="m" style="margin-top:8px;font-size:11px;word-break:break-word">Siap.</div>
  </div>
</div>

<div id="app" class="hide">
  <nav id="nav"></nav>
  <div id="bn" class="card hide" style="background:#2b230c;border-color:#5c4a16"></div>
  <div id="v"></div>
</div>

<div id="modal" onclick="if(event.target===this)closeModal()">
  <div class="mbox">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
      <h2 id="mTitle" style="margin:0">Detail Produk</h2>
      <button class="btn" type="button" onclick="closeModal()">Tutup</button>
    </div>
    <div id="mBody" style="margin-top:10px"></div>
  </div>
</div>

function generateDynamicResearchBatch(count, existingProducts){
  const n = Math.max(1, Math.min(count || 5, 10));
  const usedTitles = new Set((existingProducts || []).map(x => String(x.title || "").trim().toLowerCase()));
  const batchSeed = Date.now() + Math.floor(Math.random() * 10000);
  const picked = [];
  const maxAttempts = DYNAMIC_DOMAINS.length * DYNAMIC_ANGLES.length * DYNAMIC_FORMATS.length;

  for(let attempt = 0; attempt < maxAttempts && picked.length < n; attempt++){
    const dIdx = (batchSeed + attempt * 7) % DYNAMIC_DOMAINS.length;
    const aIdx = Math.floor((batchSeed + attempt * 13) / DYNAMIC_DOMAINS.length) % DYNAMIC_ANGLES.length;
    const fIdx = Math.floor((batchSeed + attempt * 19) / (DYNAMIC_DOMAINS.length * DYNAMIC_ANGLES.length)) % DYNAMIC_FORMATS.length;

    const dom = DYNAMIC_DOMAINS[dIdx];
    const ang = DYNAMIC_ANGLES[aIdx];
    const fmt = DYNAMIC_FORMATS[fIdx];

    const coreTopic = `${dom.niche} - ${ang.focus}`;
    const title = `The Complete ${coreTopic} ${fmt.suffix}`;
    const normTitle = title.toLowerCase();

    if(usedTitles.has(normTitle)) continue;
    usedTitles.add(normTitle);

    const marketPrice = Math.max(19, Math.min(990, dom.basePrice + ang.priceDelta + ((attempt % 3) - 1) * 5));
    const price = makeMarketPrice(marketPrice, dom.cut);
    const demandScore = Math.max(82, Math.min(98, dom.demandScore - ((dIdx + aIdx) % 4)));
    const qc = Math.max(86, Math.min(96, 89 + ((attempt + dIdx) % 6)));

    picked.push({
      niche: coreTopic,
      title,
      subtitle: ang.subtitle,
      aud: dom.aud,
      demandScore,
      marketPrice,
      price,
      qc,
      marketNote: `Riset dinamis (${fmt.label}): patokan pasar ~$${marketPrice}, dipatok $${price} (-$${dom.cut}) untuk fokus ${ang.focus.toLowerCase()}.`,
      sop: `${dom.sopCode}-${String(((dIdx + aIdx + fIdx) % 89) + 10)}: Audit biaya & nilai ${ang.focus.toLowerCase()}, terapkan struktur ${fmt.label}, lalu verifikasi QC.`
    });
  }

  while(picked.length < n){
    const idx = (batchSeed + picked.length) % DYNAMIC_DOMAINS.length;
    const dom = DYNAMIC_DOMAINS[idx];
    const ang = DYNAMIC_ANGLES[(batchSeed + picked.length * 3) % DYNAMIC_ANGLES.length];
    const fmt = DYNAMIC_FORMATS[(batchSeed + picked.length * 5) % DYNAMIC_FORMATS.length];
    const suffixNum = (batchSeed % 900) + 100 + picked.length;
    const title = `The Complete ${dom.niche} ${fmt.suffix} #${suffixNum}`;
    const marketPrice = Math.max(19, Math.min(990, dom.basePrice + ang.priceDelta));
    const price = makeMarketPrice(marketPrice, dom.cut);

    picked.push({
      niche: `${dom.niche} - ${ang.focus}`,
      title,
      subtitle: ang.subtitle,
      aud: dom.aud,
      demandScore: dom.demandScore,
      marketPrice,
      price,
      qc: 90,
      marketNote: `Riset dinamis (#${suffixNum}): patokan pasar ~$${marketPrice}, dipatok $${price} (-$${dom.cut}).`,
      sop: `${dom.sopCode}-DYN: Susun struktur ${fmt.label}, hitung batas margin, dan selesaikan QC sebelum rilis.`
    });
  }

  return picked;
}

function setRaw(k, v){

    }
  }catch{}
  return MEM[k] ?? null;
}
function delRaw(k){

}

};

function H(s){
  const str = String(s ?? "");
  let h1 = 5381;
  let h2 = 2166136261;
  for(let i = 0; i < str.length; i++){
    const code = str.charCodeAt(i);
    h1 = (((h1 << 5) + h1) + code) >>> 0;
    h2 ^= code;
    h2 = Math.imul(h2, 16777619) >>> 0;
  }
  return h1.toString(16).padStart(8, "0") + h2.toString(16).padStart(8, "0");
}

function idb(){
  return new Promise((a,b) => {
    try{
      if(!window.indexedDB) return b(new Error("no idb"));
      const r = indexedDB.open("joy_db", 1);
      r.onupgradeneeded = () => { if(!r.result.objectStoreNames.contains("kv")) r.result.createObjectStore("kv"); };
      r.onsuccess = () => a(r.result);
      r.onerror = () => b(r.error);
    }catch(err){ b(err); }
  });
}
async function G(k){
  try{
    const d = await idb();
    return await new Promise(a => {
      const q = d.transaction("kv").objectStore("kv").get(k);
      q.onsuccess = () => a(q.result ?? MEM["idb_" + k] ?? null);
      q.onerror = () => a(MEM["idb_" + k] ?? null);
    });
  }catch{ return MEM["idb_" + k] ?? null; }
}
async function Z(k,v){
  MEM["idb_" + k] = v;
  try{
    const d = await idb();
    return await new Promise(a => {
      const t = d.transaction("kv","readwrite");
      t.objectStore("kv").put(v,k);
      t.oncomplete = () => a(1);
      t.onerror = () => a(0);
    });
  }catch{ return 0; }
}

function pdfAscii(str){
  return String(str ?? "")
    .replace(/[—–]/g, "-")
    .replace(/[“”]/g, '"')
    .replace(/[’‘]/g, "'")
    .replace(/•/g, "*")
    .replace(/…/g, "...")
    .replace(/[^\x20-\x7E]/g, " ");
}

function escPdfText(str){
  return pdfAscii(str)
    .replace(/\\/g, "\\\\")
    .replace(/\(/g, "\\(")
    .replace(/\)/g, "\\)");
}

function wrapPdfLines(text, maxChars){
  const limit = maxChars || 78;
  const result = [];
  const paragraphs = String(text ?? "").split("\n");
  for(const para of paragraphs){
    if(para.trim() === ""){
      result.push("");
      continue;
    }
    const words = para.trim().split(/\s+/);
    let line = "";
    for(const w of words){
      const candidate = line ? line + " " + w : w;
      if(candidate.length <= limit){
        line = candidate;
      }else{
        if(line) result.push(line);
        if(w.length > limit){
          for(let i = 0; i < w.length; i += limit){
            result.push(w.slice(i, i + limit));
          }
          line = "";
        }else{
          line = w;
        }
      }
    }
    if(line) result.push(line);
  }
  return result;
}

function createPdfBlobFromPages(pages, prod){
  const pageW = 612;
  const pageH = 792;
  const objects = [];
  const totalPages = pages.length;

  const catalogObjNum = 1;
  const pagesObjNum = 2;
  const fontRegObjNum = 3;
  const fontBoldObjNum = 4;
  const firstPageObjNum = 5;

  const pageObjNums = [];
  const contentObjNums = [];
  for(let i = 0; i < totalPages; i++){
    pageObjNums.push(firstPageObjNum + i * 2);
    contentObjNums.push(firstPageObjNum + i * 2 + 1);
  }

  objects[catalogObjNum] = `<< /Type /Catalog /Pages ${pagesObjNum} 0 R >>`;
  objects[pagesObjNum] = `<< /Type /Pages /Kids [${pageObjNums.map(n => `${n} 0 R`).join(" ")}] /Count ${totalPages} >>`;
  objects[fontRegObjNum] = `<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>`;
  objects[fontBoldObjNum] = `<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>`;

  const headingRegex = /^(JOY CORPORATION|WELCOME PAGE|WHAT'S INSIDE|4-WEEK ACTION PLAN|TABLE OF CONTENTS|10 STEP-BY-STEP MODULES|6 FILLABLE WORKSHEETS|REAL-WORLD CASE STUDIES|PRICING CALCULATOR INSTRUCTIONS|COST-TO-SERVE CALCULATION|MINIMUM VIABLE PRICE FORMULA|PRICING LADDER|BUNDLE BUILDER|DISCOUNT APPROVAL MATRIX|PAID PILOT FRAMEWORK|PILOT ROI TRACKER|PRICING KPI DASHBOARD|LAUNCH CHECKLIST|CUSTOMER INTERVIEW QUESTIONS|ONE-PAGE PRICING PROPOSAL TEMPLATE|EMAIL LAUNCH TEMPLATES|OBJECTION HANDLING GUIDE|FAQ|PRICING DECISION TEMPLATE|CLOSING PAGE|Module \d+|Worksheet \d+)/;

  for(let p = 0; p < totalPages; p++){
    const pageLines = pages[p];
    const streamParts = [
      "0.059 0.165 0.263 rg",
      `0 ${pageH - 42} ${pageW} 42 re f`,
      "0.180 0.620 0.420 rg",
      `0 ${pageH - 46} ${pageW} 4 re f`,
      "1 1 1 rg",
      "BT /F2 11 Tf 42 764 Td (" + escPdfText("JOY CORPORATION  |  " + (prod.title || "The Complete Pricing Strategy Toolkit")) + ") Tj ET",
      "0.059 0.165 0.263 rg",
      "BT /F2 10 Tf 42 718 Td (" + escPdfText(`Page ${p + 1} of ${totalPages}`) + ") Tj ET",
      "0.118 0.149 0.188 rg"
    ];

    let y = 696;
    for(const rawLine of pageLines){
      if(y < 52) break;
      const trimmed = rawLine.trim();
      if(trimmed !== ""){
        const fontTag = headingRegex.test(trimmed) ? "/F2 10 Tf" : "/F1 9.5 Tf";
        streamParts.push(`BT ${fontTag} 42 ${y} Td (` + escPdfText(rawLine) + ") Tj ET");
      }
      y -= 14;
    }

    streamParts.push(
      "0.392 0.455 0.545 rg",
      "BT /F1 9 Tf 42 26 Td (" + escPdfText("JOY CORPORATION  -  Page " + (p + 1) + " / " + totalPages) + ") Tj ET"
    );

    const streamStr = streamParts.join("\n");
    objects[pageObjNums[p]] = `<< /Type /Page /Parent ${pagesObjNum} 0 R /MediaBox [0 0 ${pageW} ${pageH}] /Resources << /Font << /F1 ${fontRegObjNum} 0 R /F2 ${fontBoldObjNum} 0 R >> >> /Contents ${contentObjNums[p]} 0 R >>`;
    objects[contentObjNums[p]] = `<< /Length ${streamStr.length} >>\nstream\n${streamStr}\nendstream`;
  }

  let pdf = "%PDF-1.4\n";
  const offsets = [0];
  for(let i = 1; i < objects.length; i++){
    offsets[i] = pdf.length;
    pdf += `${i} 0 obj\n${objects[i]}\nendobj\n`;
  }
  const xrefPos = pdf.length;
  pdf += `xref\n0 ${objects.length}\n`;
  pdf += "0000000000 65535 f \n";
  for(let i = 1; i < objects.length; i++){
    pdf += String(offsets[i]).padStart(10, "0") + " 00000 n \n";
  }
  pdf += `trailer\n<< /Size ${objects.length} /Root ${catalogObjNum} 0 R >>\nstartxref\n${xrefPos}\n%%EOF`;

  return new Blob([pdf], { type: "application/pdf" });
}

function triggerBlobDownload(blob, filename){
  const url = URL.createObjectURL(blob);
  try{
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.rel = "noopener";
    a.style.display = "none";
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      a.remove();
      URL.revokeObjectURL(url);
    }, 2500);
    return true;
  }catch{
    URL.revokeObjectURL(url);
    return false;
  }
}

    return true;
  }catch(err){
    setDlBanner("Gagal membuat PDF: " + (err?.message || err));
    return false;
  }
}

  ctx.lineWidth = 4;

  ctx.arc(1045, 610, 34, 0, Math.PI * 2);
  ctx.stroke();
  ctx.fillStyle = "#6ee7b7";
  ctx.font = "bold 28px system-ui,sans-serif";
  ctx.fillText("$", 1036, 620);

  ctx.fillStyle = "#e2e8f0";
  ctx.font = "bold 20px system-ui,sans-serif";
  ctx.fillText("VALUE & TIERS", 972, 682);
  ctx.fillText("ROI & MARGINS", 1258, 682);

  ctx.fillStyle = "#6ee7b7";
  ctx.font = "bold 24px system-ui,sans-serif";
  ctx.fillText("JOY CORPORATION", 90, 130);

  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 66px system-ui,sans-serif";
  const mainTitle = (x.title || "The Complete Pricing Strategy Toolkit");
  const tWords = mainTitle.split(" ");
  let line1 = "";
  let line2 = "";
  for(const w of tWords){
    if((line1 + " " + w).trim().length <= 24) line1 = (line1 + " " + w).trim();
    else line2 = (line2 + " " + w).trim();
  }
  ctx.fillText(line1 || "The Complete Pricing", 90, 270);
  if(line2) ctx.fillText(line2, 90, 350);

  ctx.fillStyle = "#cbd5e1";
  ctx.font = "30px system-ui,sans-serif";
  const sub = x.subtitle || "How to Price SaaS, AI & Enterprise Solutions with Confidence";
  ctx.fillText(sub.slice(0, 56), 90, line2 ? 430 : 355);

  ctx.fillStyle = "#2E9E6B";
  ctx.fillRect(90, 770, 180, 6);
  ctx.fillStyle = "#94a3b8";
  ctx.font = "22px system-ui,sans-serif";
  ctx.fillText("JOY CORPORATION", 90, 815);

  return c;
}

function renderThumbnailCanvas(x){
  const c = document.createElement("canvas");
  c.width = 600;
  c.height = 600;
  const ctx = c.getContext("2d");

  ctx.fillStyle = "#0F2A43";
  ctx.fillRect(0, 0, 600, 600);

  ctx.fillStyle = "#2E9E6B";
  ctx.fillRect(0, 0, 600, 12);

  const bHeights = [54, 78, 66, 102, 132];
  bHeights.forEach((h, i) => {
    ctx.fillStyle = i === bHeights.length - 1 ? "#2E9E6B" : "rgba(255,255,255,0.22)";
    ctx.fillRect(54 + i * 34, 215 - h, 22, h);
  });

  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 46px system-ui,sans-serif";
  ctx.fillText("Pricing Strategy", 54, 295);
  ctx.fillText("Toolkit", 54, 348);

  ctx.fillStyle = "#6ee7b7";
  ctx.font = "bold 24px system-ui,sans-serif";
  ctx.fillText("For SaaS, AI & Enterprise", 54, 405);

  ctx.fillStyle = "#cbd5e1";
  ctx.font = "bold 20px system-ui,sans-serif";
  ctx.fillText("JOY CORPORATION", 54, 535);

  return c;
}

function localAssistantReply(promptText){
  const q = String(promptText || "").trim();
  const ql = q.toLowerCase();
  const prods = P();

  if(/riset|ide|topik|niche|baru|variasi/.test(ql)){
    const sample = generateDynamicResearchBatch(3, prods);
    return [
      "Saran topik riset baru untuk JOY CORPORATION:",
      ...sample.map((s, i) => `${i + 1}. ${s.title} — patokan ~$${s.marketPrice}, saran harga $${s.price}`),
      "Kamu juga bisa langsung tekan tombol 'Riset Market & Produksi 5 Produk Otomatis' di tab Pabrik."
    ].join("\n");
  }

  if(/harga|pricing|tier|mvp|margin|diskon/.test(ql)){
    return [
      "Ringkasan kerangka harga & margin:",
      "- Hitung Cost-to-Serve (biaya langsung + dukungan/setup + tooling).",
      "- Gunakan rumus batas bawah: MVP Price = Cost-to-Serve / (1 - Target Margin).",
      "- Pisahkan tier Starter, Professional, dan Enterprise berdasarkan cakupan serta aturan diskon yang jelas."
    ].join("\n");
  }

  if(/status|produk|qc|vault|keuangan|penjualan/.test(ql)){
    const draftQc = prods.filter(x => ["draft","qc"].includes(x.status)).length;
    const pending = prods.filter(x => x.status === "pending").length;
    const pubCount = prods.filter(x => x.status === "public").length;
    return [
      `Ringkasan produk saat ini: Total ${prods.length} produk (Draft/QC: ${draftQc}, Pending: ${pending}, Public: ${pubCount}).`,
      "Catatan keuangan: belum ada data penjualan nyata yang tercatat di sistem."
    ].join("\n");
  }

  return [
    `Siap bantu untuk "${q || "operasional JOY CORPORATION"}".`,
    "Saya bisa membantu menyusun sudut pandang produk, struktur harga/tier, checklist QC, atau menyarankan topik riset baru.",
    "Jika ingin jawaban model AI langsung, isi API Key & Model Gemini di pengaturan Asisten di atas."
  ].join("\n");
}

async function askAssistant(presetPrompt){
  const inp = $("chatInput");
  const text = (presetPrompt !== undefined ? String(presetPrompt) : (inp?.value || "")).trim();
  if(!text) return;

  const history = L("joy_chat", []);
  history.push({ role: "user", text, at: new Date().toISOString() });
  S("joy_chat", history.slice(-60));
  if(inp && presetPrompt === undefined) inp.value = "";
  renderChatMessages();

  const cfg = L("joy_ai_cfg", { apiKey: "", model: "gemini-3.1-flash-lite" });
  let reply = "";

  if(cfg.apiKey && cfg.apiKey.trim()){
    try{
      const modelName = (cfg.model || "gemini-3.1-flash-lite").trim();
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(modelName)}:generateContent?key=${encodeURIComponent(cfg.apiKey.trim())}`;
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          systemInstruction: {
            parts: [{ text: "Kamu adalah asisten kerja untuk Ade Kurnia Sandy di JOY CORPORATION. Jawab ringkas, praktis, berbahasa Indonesia natural, dan jangan mengarang angka penjualan atau keuangan yang belum ada." }]
          },
          contents: history.slice(-10).map(m => ({
            role: m.role === "user" ? "user" : "model",
            parts: [{ text: m.text }]
          }))
        })
      });
      const data = await res.json();
      reply = data?.candidates?.[0]?.content?.parts?.map(p => p.text).filter(Boolean).join("\n") || "";
    }catch{}
  }

  if(!reply){
    reply = localAssistantReply(text);
  }

  const updated = L("joy_chat", []);
  updated.push({ role: "bot", text: reply, at: new Date().toISOString() });
  S("joy_chat", updated.slice(-60));
  sched();
  renderChatMessages();
}

function renderChatMessages(){
  const box = $("chatBox");
  if(!box) return;
  const msgs = L("joy_chat", []);
  if(!msgs.length){
    box.innerHTML = '<div class="m">Mulai percakapan di bawah: minta ide riset baru, struktur harga/tier, atau ringkasan produk.</div>';
    return;
  }
  box.innerHTML = msgs.map(m => `
    <div class="msg ${m.role === "user" ? "user" : "bot"}">${E(m.text)}</div>
  `).join("");
  box.scrollTop = box.scrollHeight;
}

      h = '<div class="card"><h2>Keuangan</h2><p class="m">Belum ada penjualan nyata. Pendapatan dibaca dari Gumroad setelah backend aktif. Tidak ada angka palsu.</p></div>';
    }

    if(v === "chat"){
      const cfg = L("joy_ai_cfg", { apiKey: "", model: "gemini-3.1-flash-lite" });
      h = `
        <div class="card">
          <h2>Asisten JOY</h2>
          <div class="m">Diskusi cepat untuk ide riset produk, struktur tier &amp; harga, SOP, serta status antrean. Opsional: isi Gemini API Key &amp; model bila ingin terhubung langsung ke model AI.</div>
          <div class="row">
            <button class="btn" type="button" onclick="askAssistant('Beri 3 saran topik riset baru')">Ide Riset Baru</button>
            <button class="btn" type="button" onclick="askAssistant('Bantu susun struktur harga dan tier')">Struktur Harga</button>
            <button class="btn" type="button" onclick="askAssistant('Cek ringkasan produk saat ini')">Cek Produk</button>
            <button class="btn danger" type="button" onclick="clearChat()">Hapus Chat</button>
          </div>
          <div id="chatBox" class="chat-box"></div>
          <div class="row" style="margin-top:10px">
            <input id="chatInput" placeholder="Tulis pesan untuk asisten..." onkeydown="if(event.key==='Enter')askAssistant()" style="margin:0;flex:1;min-width:180px">
            <button class="btn p" type="button" onclick="askAssistant()">Kirim</button>
          </div>
        </div>
        <div class="card">
          <h3>Koneksi Model (Opsional)</h3>
          <input id="aiModel" placeholder="Model (misal: gemini-3.1-flash-lite)" value="${E(cfg.model || "gemini-3.1-flash-lite")}">
          <input id="aiKey" type="password" placeholder="Gemini API Key (kosongkan untuk mode asisten lokal)" value="${E(cfg.apiKey || "")}">
          <button class="btn" type="button" onclick="saveAiCfg()">Simpan Pengaturan Asisten</button>
        </div>`;
    }

    if(v === "settings"){
      const fh = await G("fh");
      const sn = (await G("snaps")) || [];
      let pm = "";
      if(fh && fh.queryPermission) try{ pm = await fh.queryPermission({ mode: "readwrite" }); }catch{}
      const fileStatus = pm === "granted" ? "AKTIF" : fh ? "butuh izin (tekan LOGIN)" : "belum diaktifkan";
      h = `
        <div class="card">
          <h2>Cadangan Otomatis</h2>
          <p class="m">
            Internal: AKTIF (tiap perubahan &amp; 1 jam). Terakhir: ${E(F(getRaw("joy_ls")))}<br>
            File di telepon: ${fileStatus}. Terakhir: ${E(F(getRaw("joy_lf")))}<br>
            Unduhan terakhir: ${E(F(getRaw("joy_ld")))}
          </p>
          <div class="row">
            <button class="btn p" type="button" onclick="enable()">${fh ? "Pilih File Baru" : "Aktifkan Cadangan Otomatis ke File"}</button>
            <button class="btn" type="button" onclick="exp()">Simpan Cadangan Sekarang</button>
            <label class="btn" style="display:inline-block">
              Pulihkan dari File
              <input type="file" accept=".json,application/json" class="hide" onchange="imp(event)">
            </label>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap">
            <h3 style="margin:0">Riwayat internal (${sn.length})</h3>
            ${sn.length ? `<button class="btn danger" type="button" onclick="clearSnaps()">Hapus Semua</button>` : ""}
          </div>
          <div style="margin-top:6px">
            ${sn.map((s, i) => `
              <div class="snap-item">
                <span class="m">${E(F(s.at))}</span>
                <div>
                  <button class="btn" type="button" onclick="rest(${i})">Pulihkan</button>
                  <button class="btn danger" type="button" onclick="delSnap(${i})">Hapus</button>
                </div>
              </div>`).join("") || '<div class="m">Belum ada.</div>'}
          </div>
        </div>
        <div class="card">
          <h2>PIN</h2>
          <input id="np" type="password" inputmode="numeric" maxlength="8" placeholder="PIN baru (min 6 digit)">
          <button class="btn p" type="button" onclick="saveNewPin()">Simpan PIN</button>
        </div>`;
    }

    $("v").innerHTML = h;
    if(v === "chat") renderChatMessages();
    await ban();
  }catch(err){
    dbg("Go error: " + (err?.message || err));
  }
}

function saveGum(){
  S("joy_gumroad", {
    store: $("gs").value.trim(),
    prefix: $("gp").value.trim()
  });
  log("gumroad", "disimpan");
  alert("Tersimpan");
}

function mk(){
  const rawT = $("t").value.trim() || "Pricing Strategy";
  const t = rawT.replace(/\b\w/g, c => c.toUpperCase());
  const a = $("a").value.trim() || "SaaS founders, AI product builders, consultants, product managers, freelancers, B2B teams";
  const rawPr = $("pr").value.trim();
  const parsedPr = rawPr === "" ? null : parseFloat(rawPr);
  const price = (parsedPr !== null && !Number.isNaN(parsedPr) && parsedPr >= 0) ? parsedPr : null;
  const title = rawT.toLowerCase().includes("toolkit") ? t : "The Complete " + t + " Toolkit";
  const item = {
    id: "JOY-" + Date.now(),
    title,
    niche: rawT,
    subtitle: "How to Price SaaS, AI & Enterprise Solutions with Confidence",
    price,
    status: "draft",
    qc: 0,
    aud: a,
    mode: "permintaan",
    sop: "SOP-REQ-01: 1 file PDF lengkap (40+ halaman, English) + Cover 1600x900 PNG + Thumbnail 600x600 PNG + teks Gumroad A-F."
  };
  SP([item, ...P()]);
  log("draft_permintaan_pdf", title + (price !== null ? ` ($${price})` : " (harga kosong)"));
  go("prod");
  setTimeout(() => dlPdf(item.id), 120);
}

function mkAutoBatch(count){
  const n = Math.max(1, Math.min(count || 5, 10));
  const p = P();
  const picked = generateDynamicResearchBatch(n, p);
  const now = Date.now();

  const created = picked.map((item, i) => ({
    id: "JOY-AUTO-" + (now + i),
    title: item.title,
    niche: item.niche,
    subtitle: item.subtitle,
    price: item.price,
    marketPrice: item.marketPrice,
    demandScore: item.demandScore,
    marketNote: item.marketNote,
    status: "draft",
    qc: item.qc,
    aud: item.aud,
    mode: "otomatis",
    sop: item.sop
  }));

  SP([...created, ...p]);
  log("riset_harga_produksi_pdf_5", created.map(x => `${x.title} ($${x.price})`).join(", "));
  go("prod");
  created.forEach((item, idx) => {
    setTimeout(() => dlPdf(item.id), 200 + idx * 900);
  });
}

function pub(id){
  if(!L("joy_gumroad", {}).store) return alert("Simpan Store URL Gumroad dulu.");
  setp(id, x => x.status = "public");
  log("public", id);
  go("vault");
}

function saveNewPin(){
  const v = $("np").value.trim();
  if(v.length < 6) return alert("Minimal 6 digit.");
  setRaw("joy_pin", H(v));
  sched();
  alert("PIN diganti.");
}

if(location.protocol !== "file:" && location.protocol !== "content:" && location.protocol !== "about:" && "serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
try{ if(getRaw("joy_ses")) start(); }catch{}
</script>
